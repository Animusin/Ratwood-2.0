  - balance: "Лимит приключенцев снижен до 10% населения (2–10 мест), наёмников — до 5% (1–5 мест)."
  - rscadd: "Активная подписка Учёный или выше позволяет входить за приключенца и наёмника при заполненных местах, включая старт раунда. Плата за вход и прочие требования сохраняются; закрытые администратором роли с нулём мест остаются недоступны."
