author: "Animusin"
delete-after: true
changes:
  - balance: "Все оплачиваемые волны мигрантов требуют 100 триумфов; за один опикс теперь выдаётся 20 триумфов."
  - balance: "Вход за искателя приключений и наёмника стоит 5 триумфов; при недостаточном балансе вход недоступен."
  - rscadd: "Активная подписка Учёный или выше позволяет начать формирование двух доступных для покупки волн мигрантов в сутки (сброс в полночь UTC)."
  - rscadd: "Добавлена разовая загрузка своей песни за 200 триумфов; подписчики Учёный+ и администраторы загружают бесплатно."
  - balance: "Случайные автоматические волны приключенцев отключены; ручной вызов сохранён. Особые волны выбираются через 30 минут ожидания, затем собираются 3 минуты."
  - rscadd: "Администраторы могут бесплатно вызывать публичные волны из панели мигрантов без суточного лимита."
  - rscadd: "В карточках волн и объявлениях явно указаны обязательные роли и минимальный состав группы."
